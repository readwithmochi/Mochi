name: Keep Supabase awake

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (write + read)
        env:
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpdmlkYXljZ3ZnYm1zanpsZHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDQzNjUsImV4cCI6MjA5NDYyMDM2NX0.jF7rmn-022rpVQz0nlI_OnxzOx4o73Y7gxBHEJBiE2A
        run: |
          curl --fail --silent --show-error -X POST \
            "https://lividaycgvgbmsjzldqf.supabase.co/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
          echo
          curl --fail --silent --show-error \
            "https://lividaycgvgbmsjzldqf.supabase.co/rest/v1/books?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null
          echo "Supabase is awake"
